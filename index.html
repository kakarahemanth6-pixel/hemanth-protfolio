<!DOCTYPE html>
<html>
  <head>
<title>weather•Clone</title>
<link rel="stylesheet" href="style.css">
  </head>
<body>
  <h1 class="title">Weather report-vizag Live☁️</h1>
  <div class="weather-container">
    <div class="card sunny">
    <div class="top">
    <h2>Visakhapatnam</h2>
    <p>Today•sunny</p>
    </div>
 <div class="middle">
   <span class="icon">☀️</span>
   <h1>32°</h1>
 </div>
  <div class="bottom">
  <span>💧65% Humidity</span>
  <span>🌬️12km/h wind</span>
  </div>
  </div>
  <div class="card rainy">
  <div class="top">
    <h2>Hyderabad</h2>
    <p>Today•Rainy</p>
  </div>
    <div class="middle">
  <span class="icon">🌧️</span>
  <h1>26°</h1>
    </div>
    <div class="bottom">
  <span>💧 90% Humidity</span>
  <span>🌬️ 20km/h wind</span>
    </div>
  </div>
  <div class="card cold">
  <div class="top">
  <h2>Delhi</h2>
  <p>Today•Cold</p>
  </div>
  <div class="middle">
  <span class="icon">❄️</span>
  <h1>14°</h1>
  </div>
  <div class="bottom">
  <span>💧40% Humidity</span>
  <span>🌬️5km/h wind</span>
  </div>
  </div>
  </div>
  <div class="hourly">
  <div class="h-item">☀️<br>12PM<br><b>32°</b></div>
  <div class="h-item">🌤️<br>3PM<br><b>30°</b></div>
  <div class="h-item">🌧️<br>6PM<br><b>26°</b></div>
  <div class="h-item">🌙<br>9PM<br><b>24°</b></div>
  </div>
</body>
</html>
